name: Image CI

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  image-build:
    name: image-build-${{ matrix.image }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: socks-server
            dockerfile: ./build/socks-server/Dockerfile
            context: .
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - image: socks-server
            dockerfile: ./build/socks-server/Dockerfile
            context: .
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - image: socks-proxy
            dockerfile: ./build/socks-proxy/Dockerfile
            context: ./build/socks-proxy
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - image: socks-proxy
            dockerfile: ./build/socks-proxy/Dockerfile
            context: ./build/socks-proxy
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest-${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=registry,force-compression=true,oci-mediatypes=true

  merge-multi-arch:
    name: merge-multi-arch-${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs:
      - image-build
    strategy:
      fail-fast: false
      matrix:
        image:
          - socks-server
          - socks-proxy
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest \
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest-amd64 \
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest-arm64
