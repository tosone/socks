[package]
name = "socks"
version = "0.1.0"
description = "A macOS Shadowsocks client with Packet Tunnel integration"
authors = ["tosone"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "socks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
russh = "0.62.6"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
tokio = { version = "1", features = [
    "macros",
    "sync",
    "time",
    "rt-multi-thread",
    "net",
] }
shadowsocks = { path = "../shadowsocks-rust/crates/shadowsocks", default-features = false, features = [
    "aead-cipher",
    "aead-cipher-extra",
    "aead-cipher-2022",
    "aead-cipher-2022-extra",
    "stream-cipher",
] }

# Xcode 27's linker/strip combination intermittently produces dylibs with a
# "mis-aligned LINKEDIT string pool", which makes proc-macro crates (e.g.
# tauri_macros, futures_macro) fail to load with:
#   error[E0463]: can't find crate for `tauri_macros`
# Cargo's default release profile passes `-C strip=debuginfo`; disabling it
# avoids the buggy strip path at the cost of a larger binary.
[profile.release]
strip = "none"
