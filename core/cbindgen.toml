language = "C"
include_guard = "SOCKS_CORE_H"
pragma_once = true
cpp_compat = true
tab_width = 2
style = "both"
documentation = true
header = "/* socks-core: standard Shadowsocks userspace data plane for NEPacketTunnelProvider.\n * Generated by cbindgen from core/src/lib.rs. Do not edit by hand. */"
include_version = false
sys_includes = ["stddef.h", "stdint.h"]
autogen_warning = "/* Generated by cbindgen. Regenerate with `cargo build -p socks-core`. */"

[export]
item_types = ["enums", "structs", "functions", "typedefs", "constants"]

[fn]
args = "horizontal"
rename_args = "snake_case"

[struct]
rename_fields = "snake_case"
